version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /mcp-memory-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Compile against the oldest supported runtime so newer Node.js APIs
      # cannot enter the codebase unnoticed.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
