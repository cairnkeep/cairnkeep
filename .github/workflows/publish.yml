name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to resume
        required: true
        type: string
      prerelease:
        description: Publish to the prerelease channel
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release identity
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || inputs.prerelease }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$RELEASE_TAG" = "v$version"
          case "$version:$RELEASE_PRERELEASE" in
            *-*:true) dist_tag=next ;;
            *-*:false) echo "A prerelease version requires a prerelease GitHub release" >&2; exit 1 ;;
            *:true) echo "A stable version requires a stable GitHub release" >&2; exit 1 ;;
            *) dist_tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Download the CI-verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.identity.outputs.tree }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          artifact_name="release-candidate-$TREE"
          response=$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")
          run_id=
          while IFS=$'\t' read -r candidate_run candidate_id; do
            [[ -n "$candidate_run" && -n "$candidate_id" ]] || continue
            run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run")
            if [[ $(jq -r '.name' <<<"$run") == CI && $(jq -r '.conclusion' <<<"$run") == success ]]; then
              run_id=$candidate_run
              break
            fi
          done < <(jq -r '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse[] | [.workflow_run.id, .id] | @tsv' <<<"$response")
          [[ -n "$run_id" ]] || {
            echo "No successful CI release candidate exists for tree $TREE" >&2
            exit 1
          }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS)
          node -e '
            const candidate = require("./candidate/RELEASE-CANDIDATE.json");
            const [tree, version] = process.argv.slice(1);
            if (candidate.schema_version !== 1 || candidate.tree !== tree || candidate.version !== version) process.exit(1);
          ' "$TREE" "$VERSION"

      - name: Stage the verified candidate for publication jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-promotion-${{ steps.identity.outputs.tree }}
          path: candidate/
          if-no-files-found: error
          retention-days: 1

  npm:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-promotion-${{ needs.prepare.outputs.tree }}
          path: artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check registry state
        id: registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if npm view "@cairnkeep/cli@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.registry.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish "artifacts/cairnkeep-cli-$VERSION.tgz" --access public --provenance --tag "$DIST_TAG"

      - name: Attach package and SBOM to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "artifacts/cairnkeep-cli-$VERSION.tgz" \
            "artifacts/cairnkeep-cli-$VERSION.cdx.json" \
            artifacts/SHA256SUMS --clobber

  containers:
    needs: prepare
    name: containers (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: server
            image: ghcr.io/cairnkeep/cairnkeep
            title: Cairnkeep memory server
            description: Durable MCP memory server
            cache_scope: cairnkeep-server
          - target: workspace
            image: ghcr.io/cairnkeep/cairnkeep-workspace
            title: Cairnkeep workspace
            description: Base image for managed Cairnkeep workspaces
            cache_scope: cairnkeep-workspace
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Check image registry state
        id: registry
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.registry.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Resolve image digest and channel tag
        id: published
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" |
            awk '$1 == "Digest:" && digest == "" { digest = $2 } END { print digest }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:$DIST_TAG" "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
