name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  memory-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: mcp-memory-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-memory-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  native-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install and build from PowerShell
        shell: pwsh
        run: |
          npm ci
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
      - name: Native Windows contracts
        shell: pwsh
        run: |
          npm run test:windows
          npm --prefix mcp-memory-server test
      - name: Pack, globally install, and exercise the npm cmd shim
        shell: pwsh
        run: |
          npm pack
          $package = Get-ChildItem -Filter 'cairnkeep-cli-*.tgz' | Select-Object -First 1
          npm install --global $package.FullName
          cairn version
          cairn-container help
          cairn completion powershell | Select-String 'Register-ArgumentCompleter'
          $project = Join-Path $env:RUNNER_TEMP 'Cairnkeep Project – Windows'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          cairn bootstrap $project
          Push-Location $project
          cairn doctor
          Pop-Location
          $claude = Join-Path $env:RUNNER_TEMP 'Claude Config'
          cairn sync --apply --live-root $claude
          cairn sync --check --live-root $claude
      - name: Rehearse the native Windows learning-path lifecycle
        if: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'cairnkeep-windows-evidence'
          $lab = Join-Path $env:RUNNER_TEMP 'Cairnkeep Course Windows Lab'
          $liveRoot = Join-Path $env:RUNNER_TEMP 'Claude Course Root'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $transcript = Join-Path $evidence 'native-windows-transcript.txt'

          function Record-Section([string] $title) {
            Add-Content -Path $transcript -Value "`n## $title`n"
          }
          function Record-Command([string] $command, [scriptblock] $action) {
            Add-Content -Path $transcript -Value "PS> $command"
            $global:LASTEXITCODE = 0
            $output = & $action 2>&1 | Out-String
            Add-Content -Path $transcript -Value $output.TrimEnd()
            if ($LASTEXITCODE -ne 0) {
              throw "Command failed with exit $LASTEXITCODE`: $command"
            }
          }

          Set-Content -Path $transcript -Value @(
            '# Cairnkeep native Windows learning-path evidence',
            '',
            'Environment: GitHub-hosted Windows x64 runner',
            'Purpose: disposable Episode 11 command rehearsal'
          )

          Record-Section 'Platform and installed package'
          Record-Command '$PSVersionTable.PSVersion' { $PSVersionTable.PSVersion | Format-Table | Out-String }
          Record-Command '[System.Runtime.InteropServices.RuntimeInformation]::OSDescription' { [System.Runtime.InteropServices.RuntimeInformation]::OSDescription }
          Record-Command '[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture' { [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture }
          Record-Command 'node --version' { node --version }
          Record-Command 'git --version' { git --version }
          Record-Command 'cairn version' { cairn version }

          Record-Section 'Guided setup in a path containing spaces'
          Record-Command "cairn setup `$Lab --git init --harness 'claude,codex' --memory local --yes" {
            cairn setup $lab --git init --harness 'claude,codex' --memory local --yes
          }
          Record-Command 'git -C $Lab status --short --branch' { git -C $lab status --short --branch }
          Record-Command 'Get-ChildItem $Lab -Force' { Get-ChildItem $lab -Force | Select-Object Name, Mode | Format-Table | Out-String }
          Record-Command 'Get-ChildItem (Join-Path $Lab .ai)' { Get-ChildItem (Join-Path $lab '.ai') | Select-Object Name | Format-Table | Out-String }
          Record-Command 'Get-Content (Join-Path $Lab .codex/config.toml)' { Get-Content (Join-Path $lab '.codex/config.toml') }

          Record-Section 'Isolated Claude sync and local doctor'
          Record-Command 'cairn sync --apply --live-root $LiveRoot' { cairn sync --apply --live-root $liveRoot }
          Push-Location $lab
          try {
            Record-Command 'cairn doctor' { cairn doctor }
          } finally {
            Pop-Location
          }

          Record-Section 'Native Windows ACL'
          Record-Command 'Get-Acl (Join-Path $Lab .ai/cairnkeep.json)' {
            Get-Acl (Join-Path $lab '.ai/cairnkeep.json') |
              Select-Object Owner, AreAccessRulesProtected, AccessToString |
              Format-List | Out-String
          }

          Record-Section 'Backup-first uninstall and recovery assets'
          Record-Command 'cairn uninstall --dry-run --live-root $LiveRoot $Lab' {
            cairn uninstall --dry-run --live-root $liveRoot $lab
          }
          Record-Command 'cairn uninstall --yes --live-root $LiveRoot $Lab' {
            cairn uninstall --yes --live-root $liveRoot $lab
          }
          $backup = Get-ChildItem $HOME -Directory -Filter '.cairnkeep-uninstall-*' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $backup) { throw 'Uninstall backup directory was not created' }
          $manifest = Get-ChildItem $backup.FullName -Recurse -Filter 'manifest.json' | Select-Object -First 1
          $revert = Get-ChildItem $backup.FullName -Recurse -Filter 'revert.ps1' | Select-Object -First 1
          if (-not $manifest) { throw 'Uninstall manifest.json was not created' }
          if (-not $revert) { throw 'Uninstall revert.ps1 was not created' }
          Record-Command 'Get-ChildItem $Backup -Recurse' {
            Get-ChildItem $backup.FullName -Recurse | ForEach-Object {
              $_.FullName.Replace($backup.FullName, '<backup>')
            }
          }
          Record-Command 'Get-Content $Manifest' { Get-Content $manifest.FullName }
          Record-Command 'Get-FileHash $Transcript -Algorithm SHA256' {
            Get-FileHash $transcript -Algorithm SHA256 | Select-Object Algorithm, Hash | Format-Table | Out-String
          }
      - name: Upload native Windows learning-path evidence
        if: false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-learning-path-evidence
          path: ${{ runner.temp }}/cairnkeep-windows-evidence/
          if-no-files-found: error
          retention-days: 7

  windows-learning-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Build and install the packed release candidate
        shell: pwsh
        run: |
          npm ci
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
          npm pack
          $package = Get-ChildItem -Filter 'cairnkeep-cli-*.tgz' | Select-Object -First 1
          npm install --global $package.FullName
      - name: Rehearse the native Windows learning-path lifecycle
        shell: pwsh
        run: .github/scripts/episode11-windows-evidence.ps1
      - name: Upload native Windows learning-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-windows-learning-path-evidence
          path: ${{ runner.temp }}/cairnkeep-windows-evidence/
          if-no-files-found: error
          retention-days: 7

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public-safety guard scans the complete commit-message history.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm pack --dry-run --ignore-scripts

  # macOS ships bash 3.2; `#!/usr/bin/env bash` picks it up. Run the sync scripts
  # under a real bash 3.2 (container) so bash-4-only regressions fail here, not on
  # a contributor's Mac. CI runs on bash 5, so nothing else catches this.
  shell-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/smoke-bash32.sh   # ubuntu-latest has docker preinstalled

  # Install the packed tarball on a clean, minimal node:22 box (the engines floor)
  # and boot the server — catches missing `files` entries, an unbuilt dist, deps
  # that don't resolve under a global install, and a server that won't start.
  server-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build + pack
        run: |
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
          npm pack
      - name: Global install + boot on a clean node:22-slim container
        run: |
          docker run --rm -v "$PWD":/w -w /w node:22-slim bash -c '
            set -e
            npm i -g ./cairnkeep-cli-*.tgz
            cairn version
            cairn doctor
            scripts/smoke-mcp-boot.sh
          '

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify OCI runtime modes
        env:
          CAIRN_TEST_CONTAINERS: "1"
          CONTAINER_ENGINE: docker
        run: scripts/test-container.sh

  # The highest-fidelity fresh-system check: GitHub's macOS runners are real macOS
  # with bash 3.2 — the exact environment a contributor hit. Force /bin/bash first
  # on PATH so `env bash` resolves to 3.2, then run the documented install verbatim.
  fresh-install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install per the README on real macOS bash 3.2
        run: |
          export PATH="/bin:$PATH"          # make `env bash` pick macOS's 3.2
          bash --version | head -1
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
          npm pack
          npm i -g ./cairnkeep-cli-*.tgz
          cairn version
          cairn sync --apply --live-root "$RUNNER_TEMP/claude"
          mkdir -p "$RUNNER_TEMP/proj"
          cairn bootstrap "$RUNNER_TEMP/proj"
          ( cd "$RUNNER_TEMP/proj" && cairn doctor )
          scripts/smoke-mcp-boot.sh

  # Build the exact release payload only after every platform and runtime gate
  # passes. Release publication promotes this tree-addressed artifact instead
  # of rebuilding and rerunning the repository suite serially.
  release-candidate:
    needs:
      - memory-server
      - native-windows
      - repository
      - shell-portability
      - server-boot
      - container
      - fresh-install-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Build release candidate
        id: candidate
        run: |
          set -euo pipefail
          npm ci
          npm run build:server
          version=$(node -p "require('./package.json').version")
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p artifacts
          npm pack --pack-destination artifacts >/dev/null
          ./node_modules/.bin/cyclonedx-npm \
            --package-lock-only \
            --omit dev \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "artifacts/cairnkeep-cli-$version.cdx.json" \
            --validate \
            package.json
          (cd artifacts && sha256sum ./*.tgz ./*.json > SHA256SUMS)
          node -e '
            const fs = require("node:fs");
            const [tree, version] = process.argv.slice(1);
            fs.writeFileSync("artifacts/RELEASE-CANDIDATE.json", `${JSON.stringify({ schema_version: 1, tree, version }, null, 2)}\n`);
          ' "$tree" "$version"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ steps.candidate.outputs.tree }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
