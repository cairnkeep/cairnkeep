name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  memory-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: mcp-memory-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-memory-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Complete two-arm continuity replay
        run: node scripts/run-memory-continuity-study.mjs --all --check --summary

  native-windows:
    name: native-windows (${{ matrix.label }})
    runs-on: windows-latest
    # Native private-ACL subprocesses are part of the team security contracts.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            label: "22"
            shard: "1/10"
          - node: "24"
            label: "24"
            shard: "2/10"
          - node: "26"
            label: "26"
            shard: "3/10"
          - node: "24"
            label: "24-extended"
            shard: "4/10"
          - node: "24"
            label: "24-additional"
            shard: "5/10"
          - node: "24"
            label: "24-context"
            shard: "6/10"
          - node: "24"
            label: "24-feedback"
            shard: "7/10"
          - node: "24"
            label: "24-integrated"
            shard: "8/10"
          - node: "24"
            label: "24-replay"
            shard: "9/10"
          - node: "24"
            label: "24-integrated-ranking"
            shard: "10/10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install and build from PowerShell
        shell: pwsh
        run: |
          npm ci
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
      - name: Warm Windows ACL runtime
        timeout-minutes: 1
        shell: pwsh
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command
          '$ErrorActionPreference="Stop"; $sections=[System.Security.AccessControl.AccessControlSections]::Owner -bor [System.Security.AccessControl.AccessControlSections]::Access; $acl=[System.Security.AccessControl.DirectorySecurity]::new((Get-Location).Path,$sections); if (!$acl.Owner) { throw "Windows ACL warm-up failed" }; Write-Output "Windows ACL runtime ready"'
      - name: Focused bounded runtime input controls
        shell: pwsh
        run: node mcp-memory-server/scripts/smoke-bounded-input-reads.mjs
      - name: Native Windows CLI contracts
        shell: pwsh
        run: npm run test:windows
      - name: Sharded memory-server contracts
        shell: pwsh
        run: node mcp-memory-server/scripts/run-smoke-suite.mjs --shard ${{ matrix.shard }}
      - name: Pack, globally install, and exercise the npm cmd shim
        shell: pwsh
        run: |
          npm pack
          $package = Get-ChildItem -Filter 'cairnkeep-cli-*.tgz' | Select-Object -First 1
          npm install --global $package.FullName
          cairn version
          cairn-container help
          cairn completion powershell | Select-String 'Register-ArgumentCompleter'
          $project = Join-Path $env:RUNNER_TEMP 'Cairnkeep Project – Windows'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          cairn bootstrap $project
          Push-Location $project
          cairn doctor
          Pop-Location
          $claude = Join-Path $env:RUNNER_TEMP 'Claude Config'
          cairn sync --apply --live-root $claude
          cairn sync --check --live-root $claude

  tracked-platform:
    name: tracked-platform (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-memory-server/package-lock.json
      - run: npm --prefix mcp-memory-server ci
      - run: npm --prefix mcp-memory-server run build
      - name: Warm Windows ACL runtime
        if: runner.os == 'Windows'
        timeout-minutes: 1
        shell: pwsh
        run: >-
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command
          '$ErrorActionPreference="Stop"; $sections=[System.Security.AccessControl.AccessControlSections]::Owner -bor [System.Security.AccessControl.AccessControlSections]::Access; $acl=[System.Security.AccessControl.DirectorySecurity]::new((Get-Location).Path,$sections); if (!$acl.Owner) { throw "Windows ACL warm-up failed" }; Write-Output "Windows ACL runtime ready"'
      - name: Patched SQLite runtime admission
        run: node mcp-memory-server/scripts/smoke-memory-runtime-admission.mjs
      - name: Native file and header admission
        run: node mcp-memory-server/scripts/smoke-memory-file-admission.mjs
      - name: Fresh planning and epoch-safe recovery
        run: node mcp-memory-server/scripts/smoke-memory-store-restore.mjs
      - name: Worker ownership
        run: node mcp-memory-server/scripts/smoke-memory-database.mjs
      - name: Fresh admission
        run: node mcp-memory-server/scripts/smoke-memory-store-admission.mjs
      - name: Installed tracked worker (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = (npm pack --ignore-scripts --json | ConvertFrom-Json)[0].filename
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = Join-Path $env:RUNNER_TEMP 'Tracked package install'
          npm install --global --prefix $prefix (Join-Path (Get-Location) $package)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-memory-context-installed.mjs (Join-Path $prefix 'node_modules/@cairnkeep/cli')
      - name: Installed tracked worker (POSIX)
        if: runner.os != 'Windows'
        run: |
          package=$(npm pack --ignore-scripts --json | node -e 'let s="";process.stdin.on("data",b=>s+=b).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          prefix="$RUNNER_TEMP/Tracked package install"
          npm install --global --prefix "$prefix" "./$package"
          node scripts/test-memory-context-installed.mjs "$prefix/lib/node_modules/@cairnkeep/cli"
      - name: Diagnose runner ancestor permissions on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($start in @($env:RUNNER_TEMP, [IO.Path]::GetTempPath())) {
            $path = [IO.Path]::GetFullPath($start)
            while ($path) {
              $acl = Get-Acl -LiteralPath $path
              $access = @($acl.Access | Select-Object IdentityReference, AccessControlType, FileSystemRights, IsInherited, InheritanceFlags, PropagationFlags)
              [pscustomobject]@{path=$path;owner=$acl.Owner;access=$access} | ConvertTo-Json -Compress -Depth 4
              $parent = [IO.Directory]::GetParent($path)
              if (!$parent) { break }
              $path = $parent.FullName
            }
          }

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The public-safety guard scans the complete commit-message history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm pack --dry-run --ignore-scripts

  # macOS ships bash 3.2; `#!/usr/bin/env bash` picks it up. Run the sync scripts
  # under a real bash 3.2 (container) so bash-4-only regressions fail here, not on
  # a contributor's Mac. CI runs on bash 5, so nothing else catches this.
  shell-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/smoke-bash32.sh   # ubuntu-latest has docker preinstalled

  # Install the packed tarball on a clean, minimal node:22 box (the engines floor)
  # and boot the server — catches missing `files` entries, an unbuilt dist, deps
  # that don't resolve under a global install, and a server that won't start.
  server-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build + pack
        run: |
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
          npm pack
      - name: Global install + boot on a clean node:22-slim container
        run: |
          docker run --rm -v "$PWD":/w -w /w node:22-slim bash -c '
            set -e
            npm i -g ./cairnkeep-cli-*.tgz
            cairn version
            cairn doctor
            scripts/smoke-mcp-boot.sh
          '

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify OCI runtime modes
        env:
          CAIRN_TEST_CONTAINERS: "1"
          CONTAINER_ENGINE: docker
        run: scripts/test-container.sh

  # The highest-fidelity fresh-system check: GitHub's macOS runners are real macOS
  # with bash 3.2 — the exact environment a contributor hit. Force /bin/bash first
  # on PATH so `env bash` resolves to 3.2, then run the documented install verbatim.
  fresh-install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install per the README on real macOS bash 3.2
        run: |
          export PATH="/bin:$PATH"          # make `env bash` pick macOS's 3.2
          bash --version | head -1
          npm --prefix mcp-memory-server ci
          npm --prefix mcp-memory-server run build
          npm pack
          npm i -g ./cairnkeep-cli-*.tgz
          cairn version
          cairn sync --apply --live-root "$RUNNER_TEMP/claude"
          mkdir -p "$RUNNER_TEMP/proj"
          cairn bootstrap "$RUNNER_TEMP/proj"
          ( cd "$RUNNER_TEMP/proj" && cairn doctor )
          scripts/smoke-mcp-boot.sh

  # Build the exact release payload only after every platform and runtime gate
  # passes. Release publication promotes this tree-addressed artifact instead
  # of rebuilding and rerunning the repository suite serially.
  release-candidate:
    needs:
      - memory-server
      - native-windows
      - tracked-platform
      - repository
      - shell-portability
      - server-boot
      - container
      - fresh-install-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Build release candidate
        id: candidate
        run: |
          set -euo pipefail
          npm ci
          npm run build:server
          version=$(node -p "require('./package.json').version")
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p artifacts
          npm pack --pack-destination artifacts >/dev/null
          ./node_modules/.bin/cyclonedx-npm \
            --package-lock-only \
            --omit dev \
            --output-reproducible \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "artifacts/cairnkeep-cli-$version.cdx.json" \
            --validate \
            package.json
          (cd artifacts && sha256sum ./*.tgz ./*.json > SHA256SUMS)
          node -e '
            const fs = require("node:fs");
            const [tree, version] = process.argv.slice(1);
            fs.writeFileSync("artifacts/RELEASE-CANDIDATE.json", `${JSON.stringify({ schema_version: 1, tree, version }, null, 2)}\n`);
          ' "$tree" "$version"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload verified release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ steps.candidate.outputs.tree }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          # Retried jobs can regenerate this run-local candidate after all gates
          # pass; published packages, tags and release assets are untouched.
          overwrite: true
